[project]
name = "pot"
version = "0.1.0"
description = "A voice assistant that chains commands, controls Tuya lights, and grows one skill file at a time"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.18.3",
    "openai>=2.48.0",
    "httpx>=0.28",
    "tinytuya>=1.20.0",
    "sounddevice>=0.5.5",
    "soxr>=1.1.0",
    "numpy>=2.2",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
# Local wake word detection. Optional because onnxruntime and scipy are a big download, and a
# push-to-talk install on a laptop doesn't need either.
wakeword = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.20",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.0",
    "requests>=2.0",
]

[project.scripts]
pot = "pot.cli:app"

[tool.uv]
# openWakeWord asks for tflite-runtime on Linux, which is deprecated, stops at cp311 and has
# patchy aarch64 wheels. Its ONNX path needs none of it, so the marker is made unsatisfiable.
override-dependencies = ["tflite-runtime; platform_system == 'Java'"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
