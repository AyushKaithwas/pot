[project]
name = "pot"
version = "0.1.0"
description = "A voice assistant that chains commands, controls Tuya lights, and grows one skill file at a time"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.18.3",
    "openai>=2.48.0",
    "httpx>=0.28",
    "tinytuya>=1.20.0",
    "sounddevice>=0.5.5",
    "soxr>=1.1.0",
    "numpy>=2.2",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
pot = "pot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
