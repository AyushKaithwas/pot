# Pot's shipped defaults. Don't edit this to configure your own install: put your settings in
# ~/.config/pot/pot.toml instead, where they're merged over these and survive updates.
#
#   pot config init    write a starter file there
#   pot config path    show where it lives
#
# Secrets go in ~/.config/pot/env (OPENAI_API_KEY, TUYA_API_KEY, TUYA_API_SECRET, TUYA_API_REGION).

[assistant]
name = "Pot"
# Extra persona instructions appended to the built-in prompt.
extra_instructions = ""

[voice]
model = "gpt-realtime-2.1-mini"   # 3.2x cheaper than gpt-realtime-2.1 on audio both ways
voice = "ash"
speed = 1.15                      # 0.25-1.5; a home assistant's short answers suit a quicker read
transcribe_input = false          # billed per minute, only feeds the "you said" terminal line
transcription_model = "gpt-4o-mini-transcribe"
turn_detection = "semantic_vad"   # semantic_vad | server_vad
reasoning_effort = "low"
max_output_tokens = 800           # ~80 seconds of speech, a backstop against a monologue
# true: Pot stays answerable while a slow tool runs, but reports each result separately.
# false: one tighter, cheaper reply per turn, but Pot can't hear you until the tool finishes.
async_tool_calls = true

[audio]
# push_to_talk needs a keyboard. A standalone device wants wake_word, which also means audio only
# reaches OpenAI once the word fires, so an empty room costs nothing.
mode = "push_to_talk"
auto_reopen = true      # reopen the mic once Pot stops talking, so one keypress starts a conversation
cues = true             # earcons for listening/working/errors: the only status a screenless device has
cue_volume = 0.2
# Subtract Pot's own playback from what the wake word detector hears, so it can still hear you
# while Pot is talking. About 8 dB on a laptop; measure yours with `pot audio echo`. This cannot
# touch music from another app, which has no reference signal: see the README.
echo_suppression = true
# Audio gathered before playback starts. A network spike longer than this empties the buffer
# mid-word, which is heard as a click, and `pot talk` counts them when it exits. 120 is fine on a
# wired or steady connection; try 300 on Wi-Fi. The cost is that Pot starts talking that much later.
playback_buffer_ms = 120
sample_rate = 24000
input_device = ""       # substring of the device name, empty = system default. See `pot audio devices`
output_device = ""

[audio.wake]
# Needs the extra: uv sync --extra wakeword. Runs entirely on the machine, and nothing is uploaded
# at runtime; the stock models are fetched once, about 1 MB each.
#
# Stock triggers: hey_mycroft, alexa, hey_jarvis, hey_rhasspy. They're trained on synthetic speech
# and differ a lot on real voices: measured across three voices at three volumes, hey_mycroft
# fired 9/9 (median 1.000), alexa 9/9 (0.931), hey_jarvis only 6/9 with 0.14 on one voice.
# `pot audio benchmark` measures them against your voice, which is the comparison that counts.
#
# Any listed trigger wakes Pot, and each costs about 1 ms per 80 ms of audio, so listing two is a
# cheap way to be heard more often. A path ending .onnx is a model you trained yourself, which is
# the real fix if none of the stock ones hear you: see docs/custom-wake-word.md.
models = []                     # empty = hey_mycroft
threshold = 0.5                 # lower catches more and misfires more; tune with `pot audio wake`
preroll_seconds = 0.2           # replayed on wake, in case detection lands a fraction late.
                                # Raise it if the first word of a request gets clipped; much
                                # higher and the wake word itself is sent and answered.
conversation_idle_seconds = 15  # quiet for this long and Pot goes back to waiting for the word

[service]
# Empty means Pot talks to OpenAI directly with your own OPENAI_API_KEY. That is the default and
# stays the default: this project expects you to bring your own keys.
#
# Point these at an OpenAI-compatible relay to have someone else hold the keys instead, with
# POT_SERVICE_TOKEN in your env file as the credential. Only the endpoint changes; every feature
# behaves the same either way.
base_url = ""      # e.g. "https://api.example.com/v1"
realtime_url = ""  # only if the websocket isn't <base_url>/realtime

[skills]
# Empty enabled = load everything discovered. disabled always wins.
enabled = []
disabled = []

[research]
model = "gpt-5.4-nano"              # quick lookups: weather, opening hours, scores
deep_model = "gpt-5.6"              # only when the model asks for depth
search_context_size = "low"
deep_search_context_size = "medium"

[music]
provider = "spotify"
preferred_device = ""     # a speaker name to favour, e.g. "Echo Dot"; empty = whatever's awake
duck_to_percent = 20      # music dips to this while Pot talks or listens, then goes back

[music.spotify]
# Your own Spotify app from developer.spotify.com/dashboard. Spotify caps a development-mode app
# at five users, so everyone runs their own rather than sharing one.
# Add http://127.0.0.1:8765/callback to the app's redirect URIs, then run `pot music login`.
client_id = ""
redirect_port = 8765

[music.speaker]
# Makes Pot itself a Spotify Connect speaker, the way an Echo is one. Needs librespot installed
# and a Premium account. Off by default: it's an unofficial Spotify client.
#
# Turn this on if you want Pot to hear you over music. Its audio is mixed through Pot rather than
# going to the sound card directly, which is what lets echo suppression subtract the music from
# what the microphone hears. Music played on any other device can't be removed, so Pot competes
# with it and usually loses. Nothing to configure per platform: the pipe is the same on a Mac and
# on a Pi.
enabled = false
name = "Pot"              # what to pick in Spotify's device list
binary = "librespot"
bitrate = 160

# Lights are yours to declare, in ~/.config/pot/pot.toml. Find the gwid with `pot lights scan`:
#
#   [lights.devices.tube]
#   gwid = "..."
#   name = "Tube light"
#   room = "bedroom"
#   aliases = ["tube", "batten"]
#
#   [lights.scenes.night]
#   tube = { power = true, brightness_pct = 10, color_temp_pct = 0 }

[costs]
show_per_turn = true                # print what each turn cost as it happens

# Dollars per million tokens. Update these when OpenAI's prices change; nothing else needs editing.
[costs.models."gpt-realtime-2.1-mini"]
audio_in = 10.0
cached_audio_in = 0.30
audio_out = 20.0
text_in = 0.60
cached_text_in = 0.06
text_out = 2.40

[costs.models."gpt-realtime-2.1"]
audio_in = 32.0
cached_audio_in = 0.40
audio_out = 64.0
text_in = 4.0
cached_text_in = 0.40
text_out = 24.0

[costs.models."gpt-5.4-nano"]
text_in = 0.20
cached_text_in = 0.02
text_out = 1.25

[costs.models."gpt-5.4-mini"]
text_in = 0.75
cached_text_in = 0.075
text_out = 4.50

[costs.models."gpt-5.6"]
text_in = 5.0
cached_text_in = 0.50
text_out = 30.0
