# Pot's shipped defaults. Don't edit this to configure your own install: put your settings in
# ~/.config/pot/pot.toml instead, where they're merged over these and survive updates.
#
#   pot config init    write a starter file there
#   pot config path    show where it lives
#
# Secrets go in ~/.config/pot/env (OPENAI_API_KEY, TUYA_API_KEY, TUYA_API_SECRET, TUYA_API_REGION).

[assistant]
name = "Pot"
# Extra persona instructions appended to the built-in prompt.
extra_instructions = ""

[voice]
model = "gpt-realtime-2.1-mini"   # 3.2x cheaper than gpt-realtime-2.1 on audio both ways
voice = "ash"
speed = 1.15                      # 0.25-1.5; a home assistant's short answers suit a quicker read
transcribe_input = false          # billed per minute, only feeds the "you said" terminal line
transcription_model = "gpt-4o-mini-transcribe"
turn_detection = "semantic_vad"   # semantic_vad | server_vad
reasoning_effort = "low"
max_output_tokens = 800           # ~80 seconds of speech, a backstop against a monologue
# true: Pot stays answerable while a slow tool runs, but reports each result separately.
# false: one tighter, cheaper reply per turn, but Pot can't hear you until the tool finishes.
async_tool_calls = true

[audio]
# push_to_talk needs a keyboard. A standalone device wants wake_word, which also means audio only
# reaches OpenAI once the word fires, so an empty room costs nothing.
mode = "push_to_talk"
auto_reopen = true      # reopen the mic once Pot stops talking, so one keypress starts a conversation
cues = true             # earcons for listening/working/errors: the only status a screenless device has
cue_volume = 0.2
sample_rate = 24000
input_device = ""       # substring of the device name, empty = system default. See `pot audio devices`
output_device = ""

[audio.wake]
# Needs the extra: uv sync --extra wakeword. Stock triggers are alexa, hey_jarvis, hey_mycroft
# and hey_rhasspy; a custom "hey pot" is a training run, not a config change.
model = "hey_jarvis"
threshold = 0.5                 # lower catches more and misfires more; tune with `pot audio wake`
conversation_idle_seconds = 15  # quiet for this long and Pot goes back to waiting for the word

[skills]
# Empty enabled = load everything discovered. disabled always wins.
enabled = []
disabled = []

[research]
model = "gpt-5.4-nano"              # quick lookups: weather, opening hours, scores
deep_model = "gpt-5.6"              # only when the model asks for depth
search_context_size = "low"
deep_search_context_size = "medium"

[music]
provider = "spotify"
preferred_device = ""     # a speaker name to favour, e.g. "Echo Dot"; empty = whatever's awake
duck_to_percent = 20      # music dips to this while Pot talks or listens, then goes back

[music.spotify]
# Your own Spotify app from developer.spotify.com/dashboard. Spotify caps a development-mode app
# at five users, so everyone runs their own rather than sharing one.
# Add http://127.0.0.1:8765/callback to the app's redirect URIs, then run `pot music login`.
client_id = ""
redirect_port = 8765

[music.speaker]
# Makes Pot itself a Spotify Connect speaker, the way an Echo is one. Needs librespot installed
# and a Premium account. Off by default: it's an unofficial Spotify client.
enabled = false
name = "Pot"
binary = "librespot"
backend = "rodio"         # rodio on macOS, alsa on a Raspberry Pi
bitrate = 160
device = ""               # backend-specific output device, empty = system default

# Lights are yours to declare, in ~/.config/pot/pot.toml. Find the gwid with `pot lights scan`:
#
#   [lights.devices.tube]
#   gwid = "..."
#   name = "Tube light"
#   room = "bedroom"
#   aliases = ["tube", "batten"]
#
#   [lights.scenes.night]
#   tube = { power = true, brightness_pct = 10, color_temp_pct = 0 }

[costs]
show_per_turn = true                # print what each turn cost as it happens

# Dollars per million tokens. Update these when OpenAI's prices change; nothing else needs editing.
[costs.models."gpt-realtime-2.1-mini"]
audio_in = 10.0
cached_audio_in = 0.30
audio_out = 20.0
text_in = 0.60
cached_text_in = 0.06
text_out = 2.40

[costs.models."gpt-realtime-2.1"]
audio_in = 32.0
cached_audio_in = 0.40
audio_out = 64.0
text_in = 4.0
cached_text_in = 0.40
text_out = 24.0

[costs.models."gpt-5.4-nano"]
text_in = 0.20
cached_text_in = 0.02
text_out = 1.25

[costs.models."gpt-5.4-mini"]
text_in = 0.75
cached_text_in = 0.075
text_out = 4.50

[costs.models."gpt-5.6"]
text_in = 5.0
cached_text_in = 0.50
text_out = 30.0
